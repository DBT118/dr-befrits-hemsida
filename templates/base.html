<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page_title }} | Dr Befrits & Co</title>
<link rel="preload" href="/fonts/WindsorProRg.TTF" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/style.css?v={{ asset_version }}">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="left-group">
      <a class="brand" href="/">Dr Befrits <span class="amp">&amp;</span> Co</a>
      <nav class="tabs">
        <a href="/" class="{{ 'active' if active == 'about' else '' }}">Om mig</a>
        <a href="/mottagningen/" class="{{ 'active' if active == 'mottagningen' else '' }}">Mottagningen</a>
        <a href="/behandling/" class="{{ 'active' if active == 'treatments' else '' }}">Behandling</a>
      </nav>
    </div>
    <a href="/kontakt/" class="kontakt-btn {{ 'active' if active == 'contact' else '' }}">Kontakt</a>
  </div>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">
    &copy; {{ year }} Cecilia Befrits
  </div>
</footer>
</body>
</html>
